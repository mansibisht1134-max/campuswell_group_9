<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusWell - Outcomes</title>
    <link rel="stylesheet" href="./outcomes.css">
</head>

<body>

    <div class="outcomes-container">

        <header>
            <div>
                <h1>CampusWell</h1>
                <p>Wellness Outcomes</p>
            </div>

            <a href="../admin/admin.html">Back to Admin</a>
        </header>

        <main>

            <section class="welcome-section">
                <h2>Outcomes</h2>
                <p>
                    Review wellness and support outcomes recorded through the CampusWell system.
                </p>
            </section>


            <section class="outcome-summary">

                <div class="summary-card">
                    <h3>Total Cases</h3>
                    <p>0</p>
                </div>

                <div class="summary-card">
                    <h3>Improved</h3>
                    <p>0</p>
                </div>

                <div class="summary-card">
                    <h3>Needs Follow-up</h3>
                    <p>0</p>
                </div>

            </section>


            <section class="outcomes-section">

                <div class="section-header">
                    <h2>Outcome Records</h2>

                    <button type="button">
                        Add Outcome
                    </button>
                </div>

                <div class="table-container">

                    <table>

                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Support Type</th>
                                <th>Outcome</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr>
                                <td>No outcome records yet</td>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

</body>

</html>
