<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusWell | Counsellor Profile</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#edf5fd;color:#092f5c}.wrap{max-width:900px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#062b52;color:#fff;padding:22px 25px;border-radius:14px;margin-bottom:20px}.top p{color:#c5dcef;margin:6px 0 0}.top a,.btn{border:0;border-radius:8px;padding:11px 16px;background:#0879c9;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.card{background:#fff;border:1px solid #dceaf8;border-radius:14px;padding:24px;margin-bottom:18px}.hero{display:flex;align-items:center;gap:16px;margin-bottom:20px}.avatar{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#dceeff;color:#0879c9;font-size:24px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#6685a9}.field input{width:100%;padding:12px;border:1px solid #cbddec;border-radius:8px;font:inherit;color:#092f5c}.actions{display:flex;align-items:center;gap:12px;margin-top:18px}.hint{font-size:13px;color:#6685a9}@media(max-width:600px){.wrap{padding:14px}.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div><h1>CampusWell</h1><p>Counsellor account</p></div><a href="counsellor-dashboard.html">← Back to Dashboard</a></header>
<section class="card"><div class="hero"><div class="avatar" id="avatar">DS</div><div><h2 id="heroName">Dr. Sharma</h2><p>Counsellor Profile</p></div></div>
<form id="profileForm"><div class="grid">
<div class="field"><label for="name">Full name</label><input id="name" name="name" value="Dr. Sharma" required></div>
<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="Enter work email"></div>
<div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" placeholder="Enter phone number"></div>
<div class="field"><label for="department">Department</label><input id="department" name="department" value="Student Wellness & Counselling"></div>
<div class="field"><label for="specialization">Specialization</label><input id="specialization" name="specialization" placeholder="e.g. Student counselling"></div>
<div class="field"><label for="employeeId">Employee ID</label><input id="employeeId" name="employeeId" placeholder="Enter employee ID"></div>
</div><div class="actions"><button class="btn" type="submit">Save Profile</button><span class="hint" id="status" aria-live="polite">Changes are stored in this browser.</span></div></form></section>
</main><script>
const form=document.getElementById("profileForm");
const fields=["name","email","phone","department","specialization","employeeId"];
function refresh(){const n=form.elements.name.value.trim()||"Counsellor";document.getElementById("heroName").textContent=n;document.getElementById("avatar").textContent=n.split(/\\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase();}
const saved=JSON.parse(localStorage.getItem("campuswellCounsellorProfile")||"{}");
fields.forEach(k=>{if(saved[k])form.elements[k].value=saved[k];});
refresh();
form.elements.name.addEventListener("input",refresh);
form.addEventListener("submit",e=>{e.preventDefault();const data={};fields.forEach(k=>data[k]=form.elements[k].value.trim());localStorage.setItem("campuswellCounsellorProfile",JSON.stringify(data));refresh();document.getElementById("status").textContent="Profile saved successfully on this device.";});
</script></body></html>
