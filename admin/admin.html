<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusWell - Administrator Login</title>
    <link rel="stylesheet" href="./admin.css">
</head>

<body>
    <div class="login-page">
        <header class="top-header">
            <a href="../index.html" class="brand">
                <div class="logo-icon">
                    CW
                </div>
                <div class="logo-text">
                    Campus<span>Well</span>
                </div>
            </a>
        </header>
        <main class="login-main">
            <div class="login-card">
                <div class="login-icon">
                </div>
                <p class="login-label">
                    ADMINISTRATOR PORTAL
                </p>
                <h1>
                    Administrator Login
                </h1>
                <p class="login-description">
                    Sign in to manage users, analytics, interventions, outcomes and institutional wellness services.
                </p>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="adminId">
                            Administrator ID / Email
                        </label>
                        <input type="text" id="adminId" placeholder="Enter your ID or email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">
                            Password
                        </label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                    <div class="form-options">
                        <label class="remember-me">
                            <input
                                type="checkbox"
                                id="rememberMe"
                            >
                            <span>
                                Remember me
                            </span>
                        </label>
                        <a href="#">
                            Forgot Password?
                        </a>
                    </div>
                    <button type="submit" class="login-button">
                        Login
                    </button>
                    <p id="loginMessage"></p>
                </form>
                <a href="../index.html" class="back-link">
                    ← Back to Login Portal
                </a>
            </div>
        </main>
        <footer class="footer">
            <p>
                © 2026 CampusWell · Student Wellness Management System
            </p>
        </footer>
    </div>


    <script>
        const loginForm =
            document.getElementById("loginForm");

        const loginMessage =
            document.getElementById("loginMessage");
        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();
            const adminId =
                document.getElementById("adminId").value.trim();
            const password =
                document.getElementById("password").value.trim();
            if (!adminId || !password) {
                loginMessage.textContent =
                    "Please enter your Administrator ID and password.";
                loginMessage.style.color = "#d62828";
                return;
            }
            loginMessage.textContent =
                "Login successful. Opening administrator dashboard...";
            loginMessage.style.color = "#218c5a";
            setTimeout(function() {
                window.location.href =
                    "./admin-dashboard.html";
            }, 700);
        });
    </script>
</body>

</html>
