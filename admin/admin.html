<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusWell - Administrator Login</title>
    <link rel="stylesheet" href="./admin.css">
</head>

<body>
    <div class="login-page">
        <header class="top-header">
            <a href="../index.html" class="brand">
                <div class="logo-icon">
                    CW
                </div>
                <div class="logo-text">
                    Campus<span>Well</span>
                </div>
            </a>
        </header>
        <main class="login-main">
            <div class="login-card">
                <div class="login-icon">
                </div>
                <p class="login-label">
                    ADMINISTRATOR PORTAL
                </p>
                <h1>
                    Administrator Login
                </h1>
                <p class="login-description">
                    Sign in to view institutional student wellness analytics.
                </p>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="adminId">
                            Administrator ID / Email
                        </label>
                        <input type="text" id="adminId" placeholder="Enter your ID or email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">
                            Password
                        </label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                    <div class="form-options">
                        <label class="remember-me">
                            <input
                                type="checkbox"
                                id="rememberMe"
                            >
                            <span>
                                Remember me
                            </span>
                        </label>
                        <a href="#">
                            Forgot Password?
                        </a>
                    </div>
                    <button type="submit" class="login-button">
                        Login
                    </button>
                    <p id="loginMessage"></p>
                </form>
                <a href="../index.html" class="back-link">
                    ← Back to Login Portal
                </a>
            </div>
        </main>
        <footer class="footer">
            <p>
                © 2026 CampusWell · Student Wellness Management System
            </p>
        </footer>
    </div>


    <script>
        const loginForm=document.getElementById("loginForm");
        const loginMessage=document.getElementById("loginMessage");
        loginForm.addEventListener("submit",async function(event){
            event.preventDefault();
            const email=document.getElementById("adminId").value.trim();
            const password=document.getElementById("password").value;
            const button=loginForm.querySelector('button[type="submit"]');
            button.disabled=true;loginMessage.textContent="Signing in...";
            try{
                const response=await fetch("https://campuswell-api-dah4.onrender.com/api/v1/auth/login",{
                    method:"POST",headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({email,password})
                });
                const data=await response.json().catch(()=>({}));
                if(!response.ok)throw new Error(data.detail||"Invalid administrator credentials.");
                if(data.user?.role!=="admin")throw new Error("This account does not have administrator access.");
                localStorage.setItem("campuswell_access_token",data.access_token);
                localStorage.setItem("campuswell_user",JSON.stringify(data.user));
                loginMessage.textContent="Login successful. Opening Admin Analytics...";
                loginMessage.style.color="#218c5a";
                window.location.href="../analytics/analytics.html";
            }catch(error){loginMessage.textContent=error.message;loginMessage.style.color="#d62828";}
            finally{button.disabled=false;}
        });
    </script>
</body>

</html>
