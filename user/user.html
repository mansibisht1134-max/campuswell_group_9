<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusWell - Users</title>
    <link rel="stylesheet" href="./users.css">
</head>

<body>
    <div class="users-container">
        <header>
            <div>
                <h1>CampusWell</h1>
                <p>User Management</p>
            </div>
            <a href="../admin/admin.html">Back to Admin</a>
        </header>
        <main>
            <section class="welcome-section">
                <h2>Users</h2>
                <p>
                    Manage students, counsellors, and administrators registered in the CampusWell system.
                </p>
            </section>
            <section class="users-summary">
                <div class="summary-card">
                    <h3>Students</h3>
                    <p>0</p>
                </div>
                <div class="summary-card">
                    <h3>Counsellors</h3>
                    <p>0</p>
                </div>
                <div class="summary-card">
                    <h3>Administrators</h3>
                    <p>0</p>
                </div>
            </section>
            <section class="users-section">
                <div class="section-header">
                    <h2>Registered Users</h2>
                    <button type="button">
                        Add User
                    </button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>No users yet</td>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
